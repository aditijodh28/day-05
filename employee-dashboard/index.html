<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Employee Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Employee Dashboard</h1>
        <p>JavaScript Employee Management System</p>
    </header>


    <main>

        <!-- Statistics -->

        <section class="stats">

            <div class="card">
                <h3>Total Employees</h3>
                <p id="totalEmployees">0</p>
            </div>

            <div class="card">
                <h3>IT Employees</h3>
                <p id="itEmployees">0</p>
            </div>

            <div class="card">
                <h3>HR Employees</h3>
                <p id="hrEmployees">0</p>
            </div>

            <div class="card">
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>

        </section>


        <!-- Controls -->

        <section class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search employee..."
            >

            <select id="departmentFilter">

                <option value="all">
                    All Departments
                </option>

                <option value="IT">
                    IT
                </option>

                <option value="HR">
                    HR
                </option>

                <option value="Finance">
                    Finance
                </option>

            </select>


            <select id="sortSelect">

                <option value="default">
                    Sort By
                </option>

                <option value="name">
                    Name
                </option>

                <option value="salaryLow">
                    Salary: Low to High
                </option>

                <option value="salaryHigh">
                    Salary: High to Low
                </option>

            </select>

            <button id="addEmployeeButton">
                Add Employee
            </button>

        </section>


        <!-- Employee Table -->

        <section>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="employeeTableBody">
                </tbody>

            </table>

        </section>

    </main>


    <!-- Employee Modal -->

    <div id="employeeModal" class="modal">

        <div class="modal-content">

            <span id="closeModal" class="close">
                &times;
            </span>

            <h2 id="modalTitle">
                Add Employee
            </h2>


            <form id="employeeForm">

                <input
                    type="hidden"
                    id="employeeId"
                >

                <label>Name</label>

                <input
                    type="text"
                    id="employeeName"
                    required
                >


                <label>Department</label>

                <select
                    id="employeeDepartment"
                    required
                >

                    <option value="IT">
                        IT
                    </option>

                    <option value="HR">
                        HR
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                </select>


                <label>Salary</label>

                <input
                    type="number"
                    id="employeeSalary"
                    required
                >


                <button type="submit">
                    Save Employee
                </button>

            </form>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
